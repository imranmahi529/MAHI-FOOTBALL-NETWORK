<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Registration | MFN</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
<h2>MFN</h2>
</div>

<nav>
<a href="index.html">Home</a>
<a href="clubs.html">Clubs</a>
<a href="players.html">Players</a>
<a href="login.html">Login</a>
</nav>

</header>

<section class="club-register">

<h1>Register Your Club</h1>

<form>

<label>Club Name</label>
<input type="text" required>

<label>Club Logo</label>
<input type="file" accept="image/*">

<label>Club Cover Photo</label>
<input type="file" accept="image/*">

<label>District</label>
<input type="text" required>

<label>Upazila</label>
<input type="text" required>

<label>Founded Year</label>
<input type="number">

<label>Club Type</label>
<select>
<option>Football Club</option>
<option>Football Academy</option>
<option>School Team</option>
<option>College Team</option>
<option>University Team</option>
</select>

<label>Coach Name</label>
<input type="text">

<label>Manager Name</label>
<input type="text">

<label>Captain Name</label>
<input type="text">

<label>Phone Number</label>
<input type="tel">

<label>Email</label>
<input type="email">

<label>Facebook Page</label>
<input type="url">

<label>Club Description</label>
<textarea rows="5"></textarea>

<button type="submit">Register Club</button>

</form>

</section>

</body>
</html>
