<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Mahi Football Network</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
<img src="YOUR_LOGO.png" alt="MFN Logo">
<h2>MFN</h2>
</div>

<nav>
<a href="index.html">Home</a>
<a href="players.html">Players</a>
<a href="clubs.html">Clubs</a>
<a href="tournaments.html">Tournaments</a>
</nav>

</header>

<section class="register">

<h1>Join Mahi Football Network</h1>

<p>Create your football profile today.</p>

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Phone Number" required>

<input type="date" required>

<select required>
<option>Select Position</option>
<option>Goalkeeper</option>
<option>Defender</option>
<option>Midfielder</option>
<option>Forward</option>
</select>

<input type="text" placeholder="District" required>

<input type="text" placeholder="Current Club">

<input type="number" placeholder="Height (CM)">

<input type="number" placeholder="Weight (KG)">

<select>
<option>Preferred Foot</option>
<option>Right</option>
<option>Left</option>
<option>Both</option>
</select>

<textarea placeholder="Player Bio"></textarea>

<label>Profile Photo</label>
<input type="file">

<label>NID / Birth Certificate</label>
<input type="file">

<label>Football Highlight Video</label>
<input type="file">

<button type="submit">Create Account</button>

</form>

</section>

</body>
</html>
